<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购询价管理｜云同步版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei",monospace;
            image-rendering: pixelated;
        }
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --light: #f3f4f6;
            --border: #3377bb;
        }
        body {
            background: #62a8e8;
            color: #1f2937;
            overflow-x: hidden;
            position: relative;
            min-height:100vh;
        }
        .cloud {
            position:absolute;
            background:#ffffff;
            width:80px;height:32px;
            box-shadow:
                20px -8px 0 #fff,
                -20px -8px 0 #fff,
                10px -16px 0 #fff,
                -10px -16px 0 #fff;
            border-radius:4px;
            animation: floatCloud linear infinite;
            opacity:0.85;
        }
        @keyframes floatCloud {
            from {transform:translateX(-120px);}
            to {transform:translateX(calc(100vw + 120px));}
        }
        .container {max-width:1300px;margin:0 auto;padding:20px;position:relative;z-index:2;}
        .header{
            text-align:center;padding:20px;background:#fff;border:3px solid var(--border);
            box-shadow:6px 6px 0 #286199;margin-bottom:24px;border-radius:2px;
        }
        .main{display:grid;grid-template-columns:1fr 2fr;gap:20px;}
        .card{
            background:#fff;padding:24px;border:3px solid var(--border);
            box-shadow:6px 6px 0 #286199;border-radius:2px;
        }
        .card-title{font-size:18px;font-weight:bold;padding-bottom:10px;border-bottom:2px dashed var(--border);margin-bottom:20px;}
        .form-group{margin-bottom:16px;}
        label{display:block;margin-bottom:6px;font-weight:500;}
        .form-control{
            width:100%;padding:9px 12px;border:2px solid var(--border);
            border-radius:2px;font-size:14px;background:#f8fcff;
        }
        .form-control:focus{outline:none;border-color:#1959aa;box-shadow:2px 2px 0 #286199}
        .btn{
            padding:10px;border:2px solid #222;border-radius:2px;
            cursor:pointer;font-weight:500;box-shadow:3px 3px 0 #222;
        }
        .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #222;}
        .btn-primary{background:var(--primary);color:#fff;}
        .btn-success{background:var(--success);color:#fff;}
        .btn-warning{background:var(--warning);color:#fff;}
        .btn-danger{background:var(--danger);color:#fff;}
        .btn-sm{padding:4px 8px;font-size:12px;margin-left:4px;}
        .btn:disabled{opacity:0.5;pointer-events:none;}

        .sync-badge{
            display:inline-block;padding:2px 8px;background:#10b981;color:#fff;
            border-radius:2px;font-size:12px;margin-left:8px;
        }
        .loading-msg{
            text-align:center;padding:20px;color:#666;
        }

        .search-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .search-btn {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: #2563eb;
            color: #fff;
            border: 2px solid #222;
            border-radius: 2px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #222;
        }
        .search-btn:active {
            transform: translate(2px,2px);
            box-shadow: 1px 1px 0 #222;
        }

        .table{width:100%;border-collapse:collapse;margin-top:10px;}
        .table th,.table td{padding:10px 6px;border:2px solid #b4cde4;font-size:14px;vertical-align:top;}
        .table th{background:#e6f2ff;}
        .empty{text-align:center;padding:50px;color:#336;}

        .file-wrap{border:2px dashed #599cd8;padding:12px;border-radius:2px;margin-top:8px;background:#f7fbff;}
        #fileInput{display:none;}
        .upload-btn{border:2px solid var(--primary);color:var(--primary);padding:6px 12px;border-radius:2px;display:inline-block;cursor:pointer;margin-bottom:10px;box-shadow:2px 2px 0 #286199;}
        .file-item{
            display:flex;justify-content:space-between;align-items:center;
            padding:6px 8px;background:#eef6ff;border:1px solid #b8d6f0;border-radius:2px;margin:5px 0;font-size:13px;
        }
        .file-name{max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

        .file-size-warn{
            color:#ef4444;font-size:12px;margin-top:4px;
        }

        .mask{
            position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);
            display:none;align-items:center;justify-content:center;z-index:999;
        }
        .preview-box{width:90%;max-width:800px;background:#fff;padding:16px;border:3px solid #286199;box-shadow:5px 5px 0 #113;margin:8px;border-radius:2px;max-height:90vh;}
        .preview-box img{max-width:100%;max-height:75vh;}
        .close-preview{float:right;padding:5px 12px;background:#ddd;border:2px solid #666;border-radius:2px;cursor-pointer;margin-bottom:10px;box-shadow:2px 2px #555;}

        #editMask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:999;}
        .edit-box{background:#fff;width:90%;max-width:500px;padding:24px;border:3px solid #286199;box-shadow:6px 6px 0 #113;border-radius:2px;max-height:85vh;overflow-y:auto;}
        #addFileMask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:999;}
        .addFileBox{background:#fff;padding:20px;border:3px solid #286199;box-shadow:5px 5px #113;max-width:420px;width:90%;border-radius:2px;}
        .highlight{background:#fff176;font-weight:bold;padding:2px 4px;border-radius:2px;}

        @media(max-width:768px){
            .main{grid-template-columns:1fr;}
            .table{overflow-x:auto;display:block;}
        }
    </style>
</head>
<body>

<script>
(function createCloud(){
    const count = 8;
    for(let i=0;i<count;i++){
        let el = document.createElement('div');
        el.className='cloud';
        let sizeW = 50 + Math.random()*90;
        el.style.width = sizeW+'px';
        el.style.height = (sizeW/2.5)+'px';
        el.style.top = 10 + Math.random()*75 + '%';
        el.style.animationDuration = (25+Math.random()*35)+'s';
        el.style.animationDelay = Math.random()*20+'s';
        document.body.appendChild(el);
    }
})()
</script>

<div class="container">
    <div class="header">
        <h1>采购询价信息管理系统 <span class="sync-badge">云同步版</span></h1>
        <p>多人实时共享数据｜新增 / 修改 / 删除即时同步｜附件云端存储</p>
    </div>

    <div class="main">
        <div class="card">
            <div class="card-title">新增询价单据</div>
            <form id="inquiryForm">
                <div class="form-group">
                    <label>询价单号</label>
                    <input class="form-control" id="xjNo" readonly>
                </div>
                <div class="form-group">
                    <label>供应商名称<span style="color:red">*</span></label>
                    <input class="form-control" id="supplier" required placeholder="请输入供应商">
                </div>
                <div class="form-group">
                    <label>产品名称<span style="color:red">*</span></label>
                    <input class="form-control" id="goods" required placeholder="请输入产品名称">
                </div>
                <div class="form-group">
                    <label>数量(选填)</label>
                    <input class="form-control" id="num" type="number" min="0.01" step="0.01" placeholder="无则留空">
                </div>
                <div class="form-group">
                    <label>单价(元)(选填)</label>
                    <input class="form-control" id="price" type="number" min="0.01" step="0.01" placeholder="无则留空">
                </div>
                <div class="form-group">
                    <label>总价(元)(选填)</label>
                    <input class="form-control" id="totalPrice" type="number" min="0.01" step="0.01" placeholder="手动填写总价">
                </div>
                <div class="form-group">
                    <label>询价日期<span style="color:red">*</span></label>
                    <input class="form-control" id="askDate" type="date" required>
                </div>
                <div class="form-group">
                    <label>备注(选填)</label>
                    <textarea class="form-control" id="remark" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>附件<span style="font-size:12px;color:#888">（Excel/PDF/图片，单文件建议 &lt; 500KB）</span></label>
                    <div class="file-wrap">
                        <label class="upload-btn" for="fileInput">选择文件上传</label>
                        <input type="file" id="fileInput" multiple accept=".xlsx,.xls,.pdf,.jpg,.jpeg,.png">
                        <div class="file-size-warn" id="fileWarn" style="display:none">⚠️ 文件过大可能导致上传失败，建议控制在 500KB 以内</div>
                        <div id="fileList"></div>
                    </div>
                </div>
                <button class="btn btn-primary" type="submit" style="width:100%" id="submitBtn">
                    保存询价单
                </button>
            </form>
        </div>

        <div class="card">
            <div class="card-title">询价档案列表</div>
            <div class="form-group">
                <div class="search-row">
                    <input class="form-control" id="search" placeholder="搜索：供应商 / 产品 / 单号">
                    <div class="search-btn" id="searchBtn" onclick="doSearch()">🔍</div>
                </div>
            </div>
            <div id="tableBox">
                <div class="loading-msg">正在加载云端数据...</div>
            </div>
        </div>
    </div>
</div>

<div class="mask" id="previewMask">
    <div class="preview-box">
        <button class="close-preview" onclick="closePreview()">关闭</button>
        <div id="previewContent"></div>
    </div>
</div>

<div id="editMask">
    <div class="edit-box">
        <h3 style="margin-bottom:16px;">修改询价单信息</h3>
        <form id="editForm">
            <input type="hidden" id="editId">
            <div class="form-group"><label>供应商</label><input class="form-control" id="editSupplier"></div>
            <div class="form-group"><label>产品名称</label><input class="form-control" id="editGoods"></div>
            <div class="form-group"><label>数量(选填)</label><input class="form-control" id="editNum"></div>
            <div class="form-group"><label>单价(选填)</label><input class="form-control" id="editPrice"></div>
            <div class="form-group"><label>总价(选填)</label><input class="form-control" id="editTotal"></div>
            <div class="form-group"><label>日期</label><input class="form-control" id="editDate" type="date"></div>
            <div class="form-group"><label>备注</label><textarea class="form-control" id="editRemark" rows="2"></textarea></div>
            <div style="display:flex;gap:10px;margin-top:10px;">
                <button type="submit" class="btn btn-success">保存修改</button>
                <button type="button" class="btn" onclick="closeEdit()">取消</button>
            </div>
        </form>
    </div>
</div>

<div id="addFileMask">
    <div class="addFileBox">
        <h3>追加附件到当前单据</h3>
        <input type="hidden" id="addFileId">
        <div class="form-group" style="margin-top:12px;">
            <label>选择新附件：</label>
            <input type="file" id="appendFileInput" multiple accept=".xlsx,.xls,.pdf,.jpg,.png">
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;">
            <button class="btn btn-success" onclick="saveAppendFile()">确认上传</button>
            <button class="btn btn-danger" onclick="closeAddFile()">关闭</button>
        </div>
    </div>
</div>

<script>
// ========== 云同步版 JS（替代 localStorage + IndexedDB） ==========

let list = [];
let tmpFiles = [];

// ---- API 封装 ----
const API_BASE = '/api/inquiries';

async function apiGetAll(search = '') {
    let url = API_BASE;
    if (search) url += '?search=' + encodeURIComponent(search);
    const res = await fetch(url);
    if (!res.ok) throw new Error('加载数据失败');
    return await res.json();
}

async function apiCreate(data) {
    const res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || '创建失败');
    return json;
}

async function apiUpdate(id, data) {
    const res = await fetch(`${API_BASE}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || '修改失败');
    return json;
}

async function apiDelete(id) {
    const res = await fetch(`${API_BASE}/${id}`, {
        method: 'DELETE'
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || '删除失败');
    return json;
}

// ---- 文件转 Base64 ----
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

// ---- 单号生成（基于本地 list 计算）----
function makeNo() {
    let y = new Date().getFullYear();
    let pre = 'XJ' + y;
    let max = 0;
    list.forEach(item => {
        if (item.xj_no && item.xj_no.startsWith(pre)) {
            let n = parseInt(item.xj_no.replace(pre, ''));
            if (n > max) max = n;
        }
    });
    document.getElementById('xjNo').value = pre + (max + 1).toString().padStart(4, '0');
}

// ---- 渲染临时文件列表（未提交的新增附件）----
function renderTmpFiles() {
    let h = '';
    let totalSize = 0;
    tmpFiles.forEach((f, i) => {
        totalSize += f.size;
        h += `<div class="file-item"><span>${f.name}（${(f.size/1024).toFixed(1)}KB）</span><button class='btn btn-sm btn-danger' onclick='tmpFiles.splice(${i},1);renderTmpFiles()'>删除</button></div>`;
    });
    document.getElementById('fileList').innerHTML = h;
    document.getElementById('fileWarn').style.display = totalSize > 500 * 1024 ? 'block' : 'none';
}

// ---- 搜索 ----
async function doSearch() {
    let key = document.getElementById('search').value.toLowerCase().trim();
    if (!key) {
        renderList(list);
        return;
    }
    let result = list.filter(item => {
        return (item.xj_no || '').toLowerCase().includes(key)
            || (item.supplier || '').toLowerCase().includes(key)
            || (item.goods || '').toLowerCase().includes(key)
            || (item.remark || '').toLowerCase().includes(key);
    });
    renderList(result, key);
}

// ---- 渲染列表 ----
function renderList(data, highlight = '') {
    let box = document.getElementById('tableBox');
    if (data.length === 0) {
        box.innerHTML = '<div class="empty">暂无询价数据</div>';
        return;
    }

    let h = `<table class="table"><thead><tr>
<th>单号</th><th>供应商</th><th>产品</th><th>数量</th><th>单价</th><th>总价</th><th>附件</th><th>操作</th>
</tr></thead><tbody>`;

    for (let item of data) {
        // 附件展示
        let filesHtml = '无附件';
        if (item._attachments && item._attachments.length > 0) {
            filesHtml = item._attachments.map(a => {
                let name = a.file_name || a.name || '未知文件';
                let fid = a.fid;
                return `<div class="file-item" style="margin:2px 0">
                    <span>${name}</span>
                    <div>
                        <button class="btn btn-sm" onclick="prev('${fid}')">预览</button>
                        <button class="btn btn-sm" onclick="down('${fid}')">下载</button>
                    </div>
                </div>`;
            }).join('');
        }

        function high(s) {
            if (!highlight || !s) return s || '-';
            return String(s).replace(new RegExp(highlight.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<span class='highlight'>${m}</span>`);
        }

        h += `<tr>
            <td>${high(item.xj_no)}</td>
            <td>${high(item.supplier)}</td>
            <td>${high(item.goods)}</td>
            <td>${item.num || '-'}</td>
            <td>${item.price || '-'}</td>
            <td>${item.total_price || '-'}</td>
            <td>${filesHtml}</td>
            <td>
                <button class="btn btn-sm btn-warning" onclick="openEdit(${item.id})">修改</button>
                <button class="btn btn-sm btn-primary" onclick="openAddFile(${item.id})">追加附件</button>
                <button class="btn btn-sm btn-danger" onclick="delItem(${item.id})">删除</button>
            </td>
        </tr>`;
    }
    h += '</tbody></table>';
    box.innerHTML = h;
}

// ---- 编辑弹窗 ----
function openEdit(id) {
    let item = list.find(x => x.id === id);
    if (!item) return;
    document.getElementById('editId').value = id;
    document.getElementById('editSupplier').value = item.supplier || '';
    document.getElementById('editGoods').value = item.goods || '';
    document.getElementById('editNum').value = item.num || '';
    document.getElementById('editPrice').value = item.price || '';
    document.getElementById('editTotal').value = item.total_price || '';
    document.getElementById('editDate').value = item.ask_date || '';
    document.getElementById('editRemark').value = item.remark || '';
    document.getElementById('editMask').style.display = 'flex';
}

function closeEdit() {
    document.getElementById('editMask').style.display = 'none';
}

document.getElementById('editForm').onsubmit = async e => {
    e.preventDefault();
    let id = document.getElementById('editId').value;
    let submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = '保存中...';

    try {
        await apiUpdate(id, {
            supplier: document.getElementById('editSupplier').value,
            goods: document.getElementById('editGoods').value,
            num: document.getElementById('editNum').value || null,
            price: document.getElementById('editPrice').value || null,
            totalPrice: document.getElementById('editTotal').value || null,
            askDate: document.getElementById('editDate').value,
            remark: document.getElementById('editRemark').value || ''
        });
        closeEdit();
        await refreshList();
        alert('修改成功！');
    } catch (err) {
        alert('修改失败：' + err.message);
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '保存修改';
    }
};

// ---- 追加附件弹窗 ----
let appendFileArr = [];

function openAddFile(id) {
    document.getElementById('addFileId').value = id;
    appendFileArr = [];
    document.getElementById('appendFileInput').value = '';
    document.getElementById('addFileMask').style.display = 'flex';
}

function closeAddFile() {
    document.getElementById('addFileMask').style.display = 'none';
    appendFileArr = [];
}

document.getElementById('appendFileInput').onchange = e => {
    appendFileArr = Array.from(e.target.files);
};

async function saveAppendFile() {
    let id = document.getElementById('addFileId').value;
    if (appendFileArr.length === 0) {
        alert('请选择要追加的文件');
        return;
    }

    // 获取现有附件，追加新文件
    let existing = list.find(x => x.id == id);
    let existingFiles = (existing._attachments || []).map(a => ({
        fid: a.fid, name: a.file_name, type: a.file_type, data: a.file_data
    }));

    for (let f of appendFileArr) {
        let b64 = await fileToBase64(f);
        existingFiles.push({
            fid: Date.now().toString(36) + Math.random().toString(36).slice(2),
            name: f.name,
            type: f.type || 'application/octet-stream',
            data: b64
        });
    }

    try {
        await apiUpdate(id, { files: existingFiles });
        closeAddFile();
        await refreshList();
        alert('附件追加成功！');
    } catch (err) {
        alert('追加失败：' + err.message);
    }
}

// ---- 删除 ----
async function delItem(id) {
    if (!confirm('确定删除本条询价及全部附件？此操作不可恢复！')) return;
    try {
        await apiDelete(id);
        await refreshList();
        alert('删除成功！');
    } catch (err) {
        alert('删除失败：' + err.message);
    }
}

// ---- 附件预览/下载 ----
function prev(fid) {
    let att = null;
    for (let item of list) {
        if (item._attachments) {
            att = item._attachments.find(a => a.fid === fid);
            if (att) break;
        }
    }
    if (!att) { alert('附件不存在'); return; }

    let c = document.getElementById('previewContent');
    let mime = att.file_type || 'application/octet-stream';
    // 使用 API 端点获取文件（避免 base64 在移动端的问题）
    let apiUrl = '/api/download/' + fid + '?inline=1';

    if (mime.includes('image')) {
        c.innerHTML = `<img src="${apiUrl}" style="max-width:100%;max-height:75vh;" onerror="this.parentElement.innerHTML='<p>图片加载失败</p>'">`;
    } else if (mime === 'application/pdf') {
        c.innerHTML = `<embed src="${apiUrl}" width="100%" height="500" type="application/pdf">`;
    } else {
        c.innerHTML = `<a href="/api/download/${fid}">文件无法预览，点击下载</a>`;
    }
    document.getElementById('previewMask').style.display = 'flex';
}

function closePreview() {
    document.getElementById('previewMask').style.display = 'none';
}

function down(fid) {
    // 移动端兼容下载：先用 fetch+blob 方式，失败则回退到直接跳转
    var url = '/api/download/' + fid;
    
    fetch(url)
        .then(function(r) {
            if (!r.ok) throw new Error('下载失败');
            // 尝试从 Content-Disposition 获取文件名
            var name = 'download';
            var cd = r.headers.get('Content-Disposition');
            if (cd) {
                var m = cd.match(/filename\*=UTF-8''(.+)/) || cd.match(/filename="(.+)"/) || cd.match(/filename=(.+)/);
                if (m) { try { name = decodeURIComponent(m[1]); } catch(e) {} }
            }
            return r.blob().then(function(b) { return { blob: b, name: name }; });
        })
        .then(function(result) {
            var objUrl = URL.createObjectURL(result.blob);
            var a = document.createElement('a');
            a.href = objUrl;
            a.download = result.name;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(function() {
                document.body.removeChild(a);
                URL.revokeObjectURL(objUrl);
            }, 5000);
        })
        .catch(function() {
            // fetch 失败回退：直接跳转触发服务器强制下载
            window.location.href = url;
        });
}

// ---- 刷新列表 ----
async function refreshList() {
    try {
        list = await apiGetAll();
        renderList(list);
    } catch (err) {
        document.getElementById('tableBox').innerHTML =
            `<div class="empty" style="color:red;">⚠️ 加载数据失败：${err.message}</div>`;
    }
    makeNo();
}

// ---- 初始化 ----
(async () => {
    // 加载云端数据
    await refreshList();

    document.getElementById('askDate').valueAsDate = new Date();

    // 文件选择
    document.getElementById('fileInput').onchange = e => {
        tmpFiles = Array.from(e.target.files);
        renderTmpFiles();
    };

    // 提交表单
    document.getElementById('inquiryForm').onsubmit = async e => {
        e.preventDefault();
        let btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = '保存中...';

        try {
            // 转换附件为 Base64
            let files = [];
            for (let f of tmpFiles) {
                let b64 = await fileToBase64(f);
                files.push({
                    fid: Date.now().toString(36) + Math.random().toString(36).slice(2),
                    name: f.name,
                    type: f.type || 'application/octet-stream',
                    data: b64
                });
            }

            await apiCreate({
                xjNo: document.getElementById('xjNo').value,
                supplier: document.getElementById('supplier').value.trim(),
                goods: document.getElementById('goods').value.trim(),
                num: document.getElementById('num').value || null,
                price: document.getElementById('price').value || null,
                totalPrice: document.getElementById('totalPrice').value || null,
                askDate: document.getElementById('askDate').value,
                remark: document.getElementById('remark').value.trim() || '',
                files: files
            });

            document.getElementById('inquiryForm').reset();
            document.getElementById('askDate').valueAsDate = new Date();
            tmpFiles = [];
            renderTmpFiles();
            await refreshList();
            alert('询价单保存成功！');
        } catch (err) {
            alert('保存失败：' + err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = '保存询价单';
        }
    };

    // 搜索
    document.getElementById('search').oninput = doSearch;
})();
</script>
